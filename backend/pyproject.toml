[project]
name = "think9-backend"
version = "0.1.0"
description = "Think9 Decision Intelligence backend (MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-ulid>=2.7",
    "openai>=1.40",
    "anthropic>=0.34",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.0",
    "tenacity>=9.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # long lines are intentional in prompt templates

[tool.pytest.ini_options]
testpaths = ["tests"]
